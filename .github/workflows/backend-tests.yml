name: backend

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        # Pin pip itself: pip-compile's resolver output (and therefore the
        # drift check below) depends on the pip version, which otherwise
        # floats with the runner image (ubuntu-latest migrates 2026-10-19).
        run: |
          pip install --upgrade "pip==26.2.1"
          pip --version
          pip install -r requirements.txt

      - name: Dependency lockfile drift check
        # Backend/requirements.txt must be exactly what pip-compile produces
        # from Backend/requirements.in, and every package must be hash-locked.
        run: |
          pip install --upgrade "pip==26.2.1" "pip-tools==7.6.2"
          pip --version
          pip-compile --version
          cp Backend/requirements.txt /tmp/committed.txt
          rc=0
          pip-compile --generate-hashes Backend/requirements.in 2> /tmp/compile-err.txt || rc=$?
          if [ $rc -ne 0 ]; then
            # pip-compile itself failed (network, resolver, tool mismatch):
            # surface its stderr through annotations — the raw log host is
            # unreachable from some networks, annotations are API-readable.
            ( tail -40 /tmp/compile-err.txt || true ) | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
              | xargs -0 echo "::error title=pip-compile-failed::" || true
            git checkout -- Backend/requirements.txt
            exit $rc
          fi
          diff -u /tmp/committed.txt Backend/requirements.txt > /tmp/lockdiff.txt || rc=$?
          if [ $rc -ne 0 ]; then
            ( head -120 /tmp/lockdiff.txt || true ) | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
              | xargs -0 echo "::error title=lockfile-drift::" || true
          fi
          git checkout -- Backend/requirements.txt
          grep -c -- "--hash=sha256:" Backend/requirements.txt
          exit $rc

      - name: Vulnerability scan (pip-audit)
        # Gate, not advisor: fails on ANY advisory beyond the deliberate,
        # documented Django-5.0-EOL budget in .pip-audit-allowlist.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -f json -o /tmp/audit.json || true
          python3 - <<'EOF'
          import json, sys
          findings = json.load(open("/tmp/audit.json"))["dependencies"]
          allow = {
              line.strip()
              for line in open(".pip-audit-allowlist")
              if line.strip().startswith("PYSEC-")
          }
          unexpected = []
          for dep in findings:
              for v in dep.get("vulns", []):
                  if v["id"] not in allow:
                      unexpected.append((dep["name"], dep["version"], v["id"]))
          if unexpected:
              for row in unexpected:
                  print("UNEXPECTED ADVISORY:", *row)
              print(
                  f"\n{len(unexpected)} advisories beyond the documented budget."
                  " Upgrade the package or justify an allowlist entry in"
                  " Backend/.pip-audit-allowlist."
              )
              sys.exit(1)
          print(f"All advisories within the documented budget ({len(allow)} allowed IDs).")
          EOF

      - name: Static analysis (bandit)
        # Scans application code only (tests/migrations excluded — test dummy
        # credentials and autogenerated code are out of scope). App-level
        # false positives carry an inline `nosec` justification comment.
        run: |
          pip install bandit
          bandit -r core users loans payments loyalty -x '*/tests/*,*/migrations/*'

      - name: Frontend JS syntax check
        run: |
          for f in Frontend/sw.js Frontend/js/*.js; do node --check "$f"; done

      - name: Django system checks
        run: python manage.py check --settings=core.test_settings

      - name: Migration drift check
        run: >-
          python manage.py makemigrations --check --dry-run --noinput
          --settings=core.test_settings

      - name: Test suite
        # Django exits 0 even when zero tests are discovered, so assert that
        # the runner actually executed something. Running from Backend/ is
        # required for discovery.
        run: |
          set -o pipefail
          python manage.py test --settings=core.test_settings --verbosity 1 | tee /tmp/tests.log
          grep -Eq "^Ran [1-9][0-9]* tests? " /tmp/tests.log || { tail -200 /tmp/tests.log; exit 1; }

      - name: Coverage gate
        # Measured baseline after hardening phases: 88% total; gate at 85 in
        # .coveragerc (fail_under). See file header for the measurement note.
        run: |
          pip install coverage
          coverage run manage.py test --settings=core.test_settings 2>&1 | tail -3
          coverage report

      - name: Deployment configuration validation
        run: >-
          python manage.py check_config --allow-test-mode
          --settings=core.ci_settings

      - name: Render blueprint drift check
        # render.yaml / render.staging.yaml are generated from deploy/*; any
        # hand edit without regenerating fails here.
        working-directory: ${{ github.workspace }}
        run: python3 scripts/render_blueprints.py --check

      - name: Static asset collection (dry run)
        # Catches collectstatic breakage (bad refs, storage misconfig) without
        # writing into STATIC_ROOT on the runner.
        run: >-
          python manage.py collectstatic --noinput --dry-run --verbosity 0
          --settings=core.ci_settings

  tests-postgres:
    # Full suite against a real PostgreSQL, production matching major
    # (project runs on Supabase Postgres 15). Re-runs the migration smoke
    # and full test discovery; SQLite-only coverage would have missed
    # constraint/index behaviour differences.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TESTDATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        # Pin pip itself: pip-compile's resolver output (and therefore the
        # drift check below) depends on the pip version, which otherwise
        # floats with the runner image (ubuntu-latest migrates 2026-10-19).
        run: |
          pip install --upgrade "pip==26.2.1"
          pip --version
          pip install -r requirements.txt

      - name: Migration smoke test (PostgreSQL)
        # migrate an empty database end to end, then prove again that no
        # model change is un-migrated.
        run: |
          python manage.py migrate --noinput --settings=core.pg_test_settings
          python manage.py makemigrations --check --dry-run --noinput \
            --settings=core.pg_test_settings

      - name: Full test suite (PostgreSQL)
        run: |
          set -o pipefail
          rc=0
          python manage.py test --settings=core.pg_test_settings --verbosity 2 | tee /tmp/pg-tests.log || rc=$?
          if [ $rc -ne 0 ]; then
            # Surface the failure tail in run annotations (API-readable).
            ( grep -E "^(FAIL|ERROR|SUBFAIL|AssertionError|Traceback|django\.|psycopg|[A-Za-z.]+Error)" /tmp/pg-tests.log | tail -40 || true ) \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
              | xargs -0 echo "::error title=postgres-suite::" || true
            # And always: the last lines unfiltered, so evidence cannot die.
            ( tail -30 /tmp/pg-tests.log || true ) \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
              | xargs -0 echo "::error title=postgres-log-tail::" || true
            exit $rc
          fi
          grep -Eq "^Ran [1-9][0-9]* tests? " /tmp/pg-tests.log || { tail -200 /tmp/pg-tests.log; exit 1; }
